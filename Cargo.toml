[package]
name = "apila"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3     # Optimize for binary size; use "3" for speed
lto = "fat"       # Enable Link-Time Optimization
codegen-units = 1 # Reduce parallel code generation for better optimization
debug = false     # Disable debug information

[[bin]]
name = "main"
path = "src/bin/main.rs"

[[bin]]
name = "scratch_main"
path = "src/bin/scratch_main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
ratatui = { version = "0.30.2" }
crossterm = { version = "0.29.0" }
color-eyre = { version = "0.6.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

# the engine under the `turso` crate, used directly because only it can stop a
# statement that runs too long
turso_core = "0.8.1"
# already a dependency of turso_core; used to count the statements in a call
turso_parser = "0.8.1"
# parses saved web pages so `read_webpage_data` can filter them by css selector
scraper = "0.27.0"
# the `search` argument of `read_webpage_data`
regex = "1.13.1"
